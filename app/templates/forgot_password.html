{% extends 'base.html' %}

{% block style %}
<link href="{{url_for('static', filename='css/form.css')}}" rel="stylesheet"/>
{% endblock %}

{% block content %}
<div class="form-container">
    <form class="form" action="{{url_for('main.forgot_password')}}", method="POST">
        <h1>Reset your password</h1>
        <p style="text-align: center;">To verify your identity, we will send you a verification code.
            <span style="font-style: italic;">
                {{masked_email}}
            </span>    
        </p>
        <button type="submit" class="btn btn-primary">Send Reset Code</button>
    </form>
</div>
{% endblock %}
