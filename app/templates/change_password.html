{% extends 'base.html' %}

{% block style %}
<link href="{{url_for('static', filename='css/form.css')}}" rel="stylesheet" />
{% endblock %}

{% block content %}

<div class="form-container">
    <form class="form" action="{{url_for('main.change_password')}}" method="POST">
        <h1>Change your password</h1>
        <div class="password-container">
            <label for="current_password" class="form-label">
                Confirm your existing password
            </label>
            <input id="current_password" name="current_password" type="text" 
                class="form-input"/>
        </div>
        <div class="password-container">
            <label for="new_password">
                Write a new password
            </label>
            <input id="new_password" name="new_password" type="text" 
                class="form-input" />
        </div>
        {% if errors %}
            <div>
                {% if errors.message %}
                    <p class="error-label">{{ errors.message }}</p>
                {% else %}
                    <p class="error-label">Something went wrong!</p>

                {% endif %}
            </div>
        {% endif %}
        <div class="submit-container">
            <button type="submit" class="btn btn-primary">Change Password</button>
        </div>
    </form>
    
</div>
{% endblock %}
