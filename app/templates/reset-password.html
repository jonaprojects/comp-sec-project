{% extends 'base.html' %}

{% block style %}
<link href="{{url_for('static', filename='css/form.css')}}" rel="stylesheet" />
{% endblock %}

{% block content %}

<div class="form-container">
    <div class="content-container" style="text-align: center">
        <h2>Enter a new password</h2>
        <form action="{{url_for('main.reset_password')}}" 
            method="POST" class="form">
        
            <div class="field-container" >
                <label for="new_password" class="form-label">Enter your new password</label>
                <input type="password" id="new_password" name="new_password" class="form-input" />
            
            {% if errors and errors['password'] %}
                <p class="error-label">{{errors['password']}}</p>
            {% endif %}

            </div>
            
            <button type="submit" class="btn btn-primary">Create new password </button>
        </form>
    </div>
</div>
{% endblock %}
